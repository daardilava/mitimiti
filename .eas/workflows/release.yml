# New store build: needed when native code or native config changes, and for every new app version.
# Builds Android (AAB) and iOS (IPA) with the production profile, then sends the iOS build to App Store Connect.
# The Android build is uploaded by hand in Play Console until google-service-account.json exists (see eas.json);
# then add a submit_android job like submit_ios.
#
# Run: npm run ship:release (or from expo.dev › Workflows)
name: Release (store builds)

on:
  workflow_dispatch: {}

jobs:
  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit iOS to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
