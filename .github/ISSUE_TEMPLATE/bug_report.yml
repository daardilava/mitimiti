name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Movimientos
        2. Tap …
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Android, iOS, Web (dev only)]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
  - type: dropdown
    id: money
    attributes:
      label: Does it affect the balance or any amount?
      description: Balance bugs are always top priority.
      options: ["No", "Yes"]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
